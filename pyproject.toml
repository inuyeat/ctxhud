[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxhud"
version = "0.1.0.dev0"
description = "Per-session context and quota status lines for AI coding agents in the terminal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
]

[project.scripts]
ctxhud = "ctxhud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
